name: lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JJ_VERSION: "0.30.0"
    steps:
      - uses: actions/checkout@v4
      - name: Shell tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck rsync
      - name: jj
        run: |
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" |
            sudo tar -xz -C /usr/local/bin ./jj
          jj config set --user user.name ci
          jj config set --user user.email ci@example.org
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - name: OCaml dependencies
        run: opam install -y dune base sexplib digestif mtime ocamlfind
      - name: Lint
        run: opam exec -- ./scripts/lint.sh
