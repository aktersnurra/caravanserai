# Independent journal reader. Do not include /etc/rsyslog.conf or claim /dev/log:
# the VM's existing local logger remains responsible for local retention.
global(workDirectory="/var/lib/rsyslog-victoria")
# LF framing requires single-line messages. Escape embedded control characters
# at input instead of splitting a multiline journal record into fake syslog lines.
$EscapeControlCharactersOnReceive on
module(load="imjournal" StateFile="imjournal.state" PersistStateInterval="100"
       IgnorePreviousMessages="on")

if ($!_SYSTEMD_UNIT == "ledger.service") then {
    action(
        type="omfwd"
        target="10.20.0.254"
        port="29514"
        protocol="tcp"
        TCP_Framing="traditional"
        template="RSYSLOG_SyslogProtocol23Format"
        action.resumeRetryCount="-1"
        queue.type="LinkedList"
        queue.filename="ledger-forward"
        queue.spoolDirectory="/var/lib/rsyslog-victoria"
        queue.size="10000"
        queue.highWatermark="8000"
        queue.lowWatermark="2000"
        queue.maxDiskSpace="128m"
        queue.saveOnShutdown="on"
        # A full queue may drop central copies, never stall the ledger service.
        queue.timeoutEnqueue="0"
    )
}
