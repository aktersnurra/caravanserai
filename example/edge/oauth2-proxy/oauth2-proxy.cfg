# Non-secret OIDC settings. Credentials are manually installed in
# /etc/oauth2-proxy/secrets.env, never in this repository.
provider = "oidc"
oidc_issuer_url = "https://id.example.org"
redirect_url = "https://logs.example.org/oauth2/callback"
http_address = "127.0.0.1:4180"
upstreams = ["static://202"]
email_domains = ["*"]
whitelist_domains = ["logs.example.org"]
cookie_name = "__Host-vmui"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
reverse_proxy = true
trusted_proxy_ips = ["127.0.0.1/32"]
