# Appended to the jail's syslog-ng config. The service writes this file
# itself, independently of syslog; only it is forwarded.
source s_reviewed_file {
    file("/var/log/counter/counter.log" flags(no-parse) read-old-records(no));
};
log { source(s_reviewed_file); destination(d_victoria); flags(flow-control); };
